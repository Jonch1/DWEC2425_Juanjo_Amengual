<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Añadir disco</title>
    <script src ="Funciones.js"></script>
</head>
<body>
<form id="AñadirDiscosForm">
  <label for="nombre">Nombre del disco:</label>
  <input type="text" id="nombre" name="nombre" required><br><br>

  <label for="grupo">Grupo musical:</label>
  <input type="text" id="grupo" name="grupo" required><br><br>

  <label for="año">Año de publicación:</label>
  <input type="date" id="año" name="año" required><br><br>

  <label for="tipo">Tipo de música:</label>
  <input type="number" id="tipo" name="tipo" required><br><br>

  <button type="submit">Añadir propiedades</button>
</form>
<script src ="Funciones.js"></script>
</body>
</html>
